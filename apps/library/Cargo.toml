[package]
name = "dexmentor-library"
version.workspace = true
edition.workspace = true
description = "DexMentor Library: the server PC's window and tray around the Python engine"

[[bin]]
name = "DexMentorLibrary"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
dexwin = { path = "../dexwin" }
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-single-instance.workspace = true
serde_json.workspace = true
