<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>DexMentor Library</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #071a1d; color: #cfe6e9; font-family: "Segoe UI", system-ui, sans-serif; }
  body { display: grid; place-items: center; overflow: hidden; }
  main { text-align: center; animation: in .5s ease-out both; }
  img { width: 168px; height: 168px; display: block; margin: 0 auto 22px; image-rendering: auto; }
  h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: .02em; color: #fff; }
  p { margin: 8px 0 0; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #8fb9be; }
  .flow { width: 180px; height: 3px; margin: 28px auto 0; border-radius: 3px; background: #12343a; overflow: hidden; }
  .flow i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #f7af44; animation: flow 1.4s ease-in-out infinite; }
  small { display: block; margin-top: 14px; font-size: 13px; color: #8fb9be; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  @keyframes flow { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { main, .flow i { animation: none; } }
</style></head>
<body><main>
  <img src="mark.png" alt="">
  <h1>DexMentor Library</h1>
  <p>Dexterity Design Services Pvt. Ltd.</p>
  <div class="flow" aria-hidden="true"><i></i></div>
  <small id="msg">Opening the Library…</small>
</main></body></html>
