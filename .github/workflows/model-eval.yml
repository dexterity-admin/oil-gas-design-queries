name: Model evaluation
on:
  push:
    branches: ["claude/**"]
    paths: ["eval/**", "desktop/**", "server/**", ".github/workflows/model-eval.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: pc-qwen2.5-1.5b, repo: Qwen/Qwen2.5-1.5B-Instruct-GGUF, suffix: "", mode: local}
          - {label: office-gemma-3-12b, repo: bartowski/google_gemma-3-12b-it-GGUF, suffix: "", mode: server}
          - {label: office-qwen3-14b, repo: bartowski/Qwen_Qwen3-14B-GGUF, suffix: " /no_think", mode: server}
          - {label: office-phi-4-14b, repo: bartowski/phi-4-GGUF, suffix: "", mode: server}
          - {label: office-mistral-nemo-12b, repo: bartowski/Mistral-Nemo-Instruct-2407-GGUF, suffix: "", mode: server}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - name: Get llama.cpp CPU build
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir rt && cd rt
          gh release list -R ggml-org/llama.cpp -L 6 || true
          TAG=$(gh release list -R ggml-org/llama.cpp -L 15 --json tagName -q '.[].tagName' | grep -E '^b[0-9]+' | head -1); echo "tag: $TAG"
          [ -n "$TAG" ] && gh release view "$TAG" -R ggml-org/llama.cpp --json assets -q '.assets[].name' && gh release download "$TAG" -R ggml-org/llama.cpp -p '*bin-ubuntu-x64.*' || true
          ls -la
          for f in *.zip; do [ -f "$f" ] && unzip -q "$f"; done
          for f in *.tar.gz; do [ -f "$f" ] && tar xzf "$f"; done
          BIN=$(find . -name llama-server -type f | head -1); echo "found: $BIN"
          if [ -n "$BIN" ]; then chmod +x "$BIN"; echo "LLAMA=$(realpath $BIN)" >> $GITHUB_ENV
          else pip install -q "llama-cpp-python[server]"; fi
      - name: Download model
        run: |
          FILE=$(curl -sL "https://huggingface.co/api/models/${{ matrix.repo }}" | python -c "import sys,json,re; f=[s['rfilename'] for s in json.load(sys.stdin)['siblings'] if re.search(r'q4_k_m\.gguf$', s['rfilename'], re.I)]; print(f[0])")
          echo "model file: $FILE"
          curl -L --fail -o model.gguf "https://huggingface.co/${{ matrix.repo }}/resolve/main/$FILE"
          ls -la model.gguf; nproc; free -m | head -2; grep -m1 "model name" /proc/cpuinfo
      - name: Evaluate
        env: {LIBRARY_DIR: "${{ github.workspace }}/evallib", DATA_DIR: "${{ github.workspace }}/evalkb", EVAL_MODE: "${{ matrix.mode }}"}
        run: |
          python eval/make_corpus.py evallib
          if [ -n "$LLAMA" ]; then
            LD_LIBRARY_PATH=$(dirname $LLAMA) $LLAMA -m model.gguf -c 8192 --port 8719 -t $(nproc) > llama.log 2>&1 &
          else
            python -m llama_cpp.server --model model.gguf --n_ctx 8192 --port 8719 --n_threads $(nproc) > llama.log 2>&1 &
          fi
          for i in $(seq 120); do curl -sf http://127.0.0.1:8719/v1/models > /dev/null && break; sleep 1; done
          echo "model RAM (MB): $(ps -eo rss,args | grep -E 'llama[-_](server|cpp)' | grep -v grep | sort -n | tail -1 | awk '{print int($1/1024)}')"
          python eval/run_eval.py http://127.0.0.1:8719 "${{ matrix.label }}" "${{ matrix.suffix }}" || { tail -30 llama.log; exit 1; }
          echo "RAM after run (MB): $(ps -eo rss,args | grep -E 'llama[-_](server|cpp)' | grep -v grep | sort -n | tail -1 | awk '{print int($1/1024)}')"

  desktop:
    name: Windows in-app download and load
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      LIBRARY_DIR: ${{ github.workspace }}\evallib
      DATA_DIR: ${{ github.workspace }}\evalkb
      DEXMENTOR_HOME: ${{ github.workspace }}\dmhome
      DEXMENTOR_FORCE_GPU_TEST: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt pyinstaller
      - name: Build DexMentor.exe
        run: pyinstaller --onefile --noconsole --name DexMentor --icon desktop/dexmentor.ico --add-data "desktop/models.json;." desktop/dexmentor.py
      - uses: actions/upload-artifact@v4
        with: {name: DexMentor-windows, path: dist/DexMentor.exe}
      - name: Download, load and ask through the real launcher exe
        shell: bash
        run: |
          python eval/make_corpus.py evallib
          python -m server > server.log 2>&1 &
          ./dist/DexMentor.exe --no-window &
          sleep 8
          curl -s -X POST http://127.0.0.1:8720/local/download
          for i in $(seq 240); do
            S=$(curl -s http://127.0.0.1:8720/local/status); echo "$S" | cut -c1-200
            echo "$S" | grep -q '"state": "ready"' && break
            echo "$S" | grep -q '"error": "[^"]' && { echo DOWNLOAD FAILED; exit 1; }
            sleep 5
          done
          find dmhome -maxdepth 3 | head -40
          curl -s http://127.0.0.1:8720/api/status | cut -c1-300
          python eval/run_eval.py http://127.0.0.1:8720/llm windows-default ""
          curl -s http://127.0.0.1:8720/local/status
          echo; tasklist //FI "IMAGENAME eq llama-server.exe" || true
          echo "unload: $(curl -s -X POST http://127.0.0.1:8720/local/unload)"; sleep 3
          echo "after unload: $(curl -s http://127.0.0.1:8720/local/status)"; tasklist //FI "IMAGENAME eq llama-server.exe" || true
