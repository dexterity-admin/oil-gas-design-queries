name: Model evaluation
on:
  push:
    branches: ["claude/**"]
    paths: ["eval/**", ".github/workflows/model-eval.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: qwen3-1.7b, repo: bartowski/Qwen_Qwen3-1.7B-GGUF, suffix: " /no_think"}
          - {label: qwen3-4b, repo: bartowski/Qwen_Qwen3-4B-GGUF, suffix: " /no_think"}
          - {label: gemma-3-4b, repo: bartowski/google_gemma-3-4b-it-GGUF, suffix: ""}
          - {label: qwen2.5-1.5b, repo: Qwen/Qwen2.5-1.5B-Instruct-GGUF, suffix: ""}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - name: Get llama.cpp CPU build
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir rt && cd rt
          gh release view -R ggml-org/llama.cpp --json tagName,assets -q '.tagName, .assets[].name' || true
          gh release download -R ggml-org/llama.cpp -p '*bin-ubuntu-x64.*' || gh release download -R ggml-org/llama.cpp -p '*ubuntu-x64.*' || true
          ls -la
          for f in *.zip; do [ -f "$f" ] && unzip -q "$f"; done
          for f in *.tar.gz; do [ -f "$f" ] && tar xzf "$f"; done
          BIN=$(find . -name llama-server -type f | head -1); echo "found: $BIN"
          if [ -n "$BIN" ]; then chmod +x "$BIN"; echo "LLAMA=$(realpath $BIN)" >> $GITHUB_ENV
          else pip install -q "llama-cpp-python[server]"; fi
      - name: Download model
        run: |
          FILE=$(curl -sL "https://huggingface.co/api/models/${{ matrix.repo }}" | python -c "import sys,json,re; f=[s['rfilename'] for s in json.load(sys.stdin)['siblings'] if re.search(r'q4_k_m\.gguf$', s['rfilename'], re.I)]; print(f[0])")
          echo "model file: $FILE"
          curl -L --fail -o model.gguf "https://huggingface.co/${{ matrix.repo }}/resolve/main/$FILE"
          ls -la model.gguf; nproc; free -m | head -2; grep -m1 "model name" /proc/cpuinfo
      - name: Evaluate
        env: {LIBRARY_DIR: "${{ github.workspace }}/evallib", DATA_DIR: "${{ github.workspace }}/evalkb"}
        run: |
          python eval/make_corpus.py evallib
          if [ -n "$LLAMA" ]; then
            LD_LIBRARY_PATH=$(dirname $LLAMA) $LLAMA -m model.gguf -c 8192 --port 8719 -t $(nproc) > llama.log 2>&1 &
          else
            python -m llama_cpp.server --model model.gguf --n_ctx 8192 --port 8719 --n_threads $(nproc) > llama.log 2>&1 &
          fi
          for i in $(seq 120); do curl -sf http://127.0.0.1:8719/v1/models > /dev/null && break; sleep 1; done
          echo "model RAM (MB): $(ps -eo rss,args | grep -E 'llama[-_](server|cpp)' | grep -v grep | sort -n | tail -1 | awk '{print int($1/1024)}')"
          python eval/run_eval.py http://127.0.0.1:8719 "${{ matrix.label }}" "${{ matrix.suffix }}" || { tail -30 llama.log; exit 1; }
          echo "RAM after run (MB): $(ps -eo rss,args | grep -E 'llama[-_](server|cpp)' | grep -v grep | sort -n | tail -1 | awk '{print int($1/1024)}')"
