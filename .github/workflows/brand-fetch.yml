name: Fetch brand assets
on:
  push:
    branches: ["claude/**"]
    paths: ["tools/fetch_brand.py", ".github/workflows/brand-fetch.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/fetch_brand.py https://dexteritydesign.co.in/
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand && git commit -m "Add brand assets fetched from the company website" && git push
