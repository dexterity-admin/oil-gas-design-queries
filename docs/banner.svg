<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="DexMentor: ask the standards, check the source">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#2c8c98" stroke-opacity=".16"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#071a1d" stop-opacity="0"/><stop offset=".55" stop-color="#071a1d" stop-opacity=".0"/><stop offset="1" stop-color="#071a1d"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9af46" stop-opacity="0"/><stop offset="1" stop-color="#f9af46" stop-opacity=".45"/></linearGradient>
    <clipPath id="page"><rect x="760" y="46" width="250" height="300" rx="4"/></clipPath>
    <style>
      .d{font-family:"Barlow Semi Condensed","Arial Narrow","Segoe UI",Arial,sans-serif;font-weight:700;letter-spacing:1px}
      .m{font-family:ui-monospace,Consolas,"Courier New",monospace}
      .grid{animation:drift 9s linear infinite}
      @keyframes drift{to{transform:translate(-28px,28px)}}
      .scan{animation:scan 4.5s ease-in-out infinite}
      @keyframes scan{0%,8%{transform:translateY(-60px)}55%,62%{transform:translateY(250px)}100%{transform:translateY(-60px)}}
      .row{animation:row 4.5s ease-in-out infinite}
      @keyframes row{0%,38%{opacity:0}46%,92%{opacity:1}100%{opacity:0}}
      .b{transform-box:fill-box;transform-origin:center;animation:pop 4.5s cubic-bezier(.2,1.6,.4,1) infinite}
      .b2{animation-delay:.25s}.b3{animation-delay:.5s}
      @keyframes pop{0%,48%{transform:scale(0);opacity:0}58%,92%{transform:scale(1);opacity:1}100%{transform:scale(0);opacity:0}}
      .lead{stroke-dasharray:220;animation:lead 4.5s ease-out infinite}
      @keyframes lead{0%,46%{stroke-dashoffset:220;opacity:0}60%,92%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}
      .l1{animation:up .9s ease-out both}.l2{animation:up .9s .25s ease-out both}.l3{animation:up .9s .6s ease-out both}.l4{animation:up .9s .9s ease-out both}
      @keyframes up{from{opacity:0;transform:translateY(18px)}}
      .pen{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
      .float{animation:float 6s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px)}}
    </style>
  </defs>
  <rect width="1200" height="380" fill="#071a1d"/>
  <g class="grid"><rect x="-28" y="-28" width="1260" height="440" fill="url(#grid)"/></g>
  <rect width="1200" height="380" fill="url(#fade)" transform="scale(-1,1) translate(-1200,0)"/>

  <!-- the source sheet being read -->
  <g class="float">
    <rect x="760" y="46" width="250" height="300" rx="4" fill="#fbfdfd"/>
    <rect x="782" y="70" width="120" height="10" fill="#143f45"/>
    <g fill="#9fb4b8"><rect x="782" y="96" width="190" height="5"/><rect x="782" y="109" width="150" height="5"/><rect x="782" y="122" width="200" height="5"/><rect x="782" y="135" width="130" height="5"/></g>
    <g fill="none" stroke="#143f45" stroke-width="1.5"><rect x="782" y="160" width="206" height="96"/><path d="M782 184h206M782 208h206M782 232h206M850 160v96M919 160v96"/></g>
    <rect class="row" x="783" y="209" width="204" height="22" fill="#ffd98a"/>
    <g fill="#5b7f85"><rect x="790" y="169" width="44" height="5" fill="#143f45"/><rect x="858" y="169" width="44" height="5" fill="#143f45"/><rect x="927" y="169" width="44" height="5" fill="#143f45"/>
      <rect x="790" y="193" width="34" height="5"/><rect x="858" y="193" width="24" height="5"/><rect x="927" y="193" width="30" height="5"/>
      <rect x="790" y="217" width="40" height="5"/><rect x="858" y="217" width="28" height="5"/><rect x="927" y="217" width="22" height="5"/>
      <rect x="790" y="241" width="30" height="5"/><rect x="858" y="241" width="36" height="5"/><rect x="927" y="241" width="26" height="5"/></g>
    <g fill="#9fb4b8"><rect x="782" y="276" width="170" height="5"/><rect x="782" y="289" width="120" height="5"/></g>
    <rect x="900" y="310" width="88" height="22" fill="none" stroke="#143f45"/>
    <g clip-path="url(#page)"><g class="scan"><rect x="760" y="20" width="250" height="60" fill="url(#beam)"/><rect x="760" y="79" width="250" height="2.5" fill="#f9af46"/></g></g>
    <path d="M756 42h14M756 42v14M1014 42h-14M1014 42v14" stroke="#f9af46" stroke-width="3" fill="none"/>
    <!-- balloons pinned to the highlighted row -->
    <path class="lead" d="M987 220L1078 150" stroke="#f9af46" stroke-width="2" fill="none"/>
    <g class="b"><circle cx="1096" cy="136" r="24" fill="#f9af46" stroke="#143f45" stroke-width="4"/><text x="1096" y="145" text-anchor="middle" class="d" font-size="26" fill="#143f45">1</text></g>
    <g class="b b2"><circle cx="1130" cy="214" r="20" fill="#f9af46" stroke="#143f45" stroke-width="4"/><text x="1130" y="222" text-anchor="middle" class="d" font-size="22" fill="#143f45">2</text></g>
    <g class="b b3"><circle cx="1090" cy="286" r="17" fill="#f9af46" stroke="#143f45" stroke-width="4"/><text x="1090" y="293" text-anchor="middle" class="d" font-size="19" fill="#143f45">3</text></g>
  </g>

  <!-- words -->
  <g transform="translate(64 0)">
    <g class="l1"><rect x="0" y="62" width="34" height="34" rx="9" transform="rotate(45 17 79)" fill="#2c8c98"/><rect x="9" y="68" width="13" height="18" fill="#fbfdfd"/><circle cx="26" cy="90" r="8" fill="#f9af46" stroke="#143f45" stroke-width="2"/>
      <text x="56" y="80" class="d" font-size="24" fill="#eaf5f7" letter-spacing="5">DEXMENTOR</text><text x="57" y="98" class="d" font-size="10.5" fill="#9ab9be" letter-spacing="3.4" font-weight="500">BY DEXTERITY INTERNATIONAL</text></g>
    <text class="d l2" x="0" y="172" font-size="52" fill="#eaf5f7">ASK THE <tspan fill="#f9af46">STANDARDS</tspan>.</text>
    <text class="d l3" x="0" y="232" font-size="52" fill="#eaf5f7">CHECK THE <tspan fill="#f9af46">SOURCE</tspan>.<tspan class="pen" fill="#f9af46"> ▌</tspan></text>
    <text class="m l4" x="2" y="278" font-size="14" fill="#9ab9be">Cited answers from your own standards. Private. Built for office PCs.</text>
  </g>
</svg>
